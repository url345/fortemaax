<title>Kit de Ferramentas com Catraca e Soquetes – 46 Peças | ForteMax Tools</title>
<style>
:root{--bg:#0e0e0e;--card:#1a1a1a;--line:#2e2e2e;--tx:#f5f5f5;--mut:#a8a8a8;--y:#ffc400;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;padding-bottom:84px}
.wrap{max-width:960px;margin:0 auto;padding:0 18px}
header{border-bottom:1px solid var(--line);padding:14px 0}
.logo{font-weight:800;font-size:20px;letter-spacing:.5px}.logo b{color:var(--y)}
.top{background:var(--y);color:#000;text-align:center;font-weight:700;font-size:13px;padding:8px}
.grid{display:grid;gap:28px;padding:24px 0}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr;align-items:start}body{padding-bottom:0}.bar{display:none!important}}
.gal{position:relative;min-width:0}.pic{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:#fff;border-radius:14px;scrollbar-width:none}.pic::-webkit-scrollbar{display:none}.pic img{flex:0 0 100%;width:100%;aspect-ratio:1/1;object-fit:contain;scroll-snap-align:start;display:block}.ar{position:absolute;top:44%;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:24px;line-height:1;cursor:pointer}.ar.l{left:8px}.ar.r{right:8px}.dots{display:flex;justify-content:center;gap:8px;margin-top:10px}.dots button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer}.dots button.on{background:var(--y);width:24px;border-radius:6px}
h1{font-size:26px;line-height:1.2;margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 16px}
.old{color:var(--mut);text-decoration:line-through}.price{font-size:38px;font-weight:800;color:var(--y);line-height:1}
.pix{color:var(--mut);font-size:14px;margin:4px 0 16px}
.qty{display:flex;align-items:center;gap:12px;margin:14px 0}
.qty button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:20px;cursor:pointer}
.qty span{min-width:28px;text-align:center;font-size:18px;font-weight:700}
.btn{display:block;width:100%;background:var(--y);color:#000;border:0;border-radius:12px;padding:16px;font-size:17px;font-weight:800;cursor:pointer}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0;font-size:15px}
.ship{color:var(--y);font-weight:700}
ul.ben{list-style:none;padding:0;margin:0;display:grid;gap:10px}ul.ben li::before{content:"✓ ";color:var(--y);font-weight:800}
h2{font-size:21px;margin:30px 0 12px}
.cols{display:grid;gap:12px}@media(min-width:600px){.cols{grid-template-columns:repeat(3,1fr)}}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}.c b{color:var(--y)}
details{border-bottom:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:600}details p{color:var(--mut);margin:8px 0 0}
footer{border-top:1px solid var(--line);margin-top:30px;padding:20px 0;color:var(--mut);font-size:13px;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;background:#111;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .p{font-size:12px;color:var(--mut)}.bar .p b{display:block;font-size:20px;color:var(--y)}.bar .btn{flex:1;padding:13px}
[hidden]{display:none!important}.alt{background:transparent;color:var(--y);border:1px solid var(--y)}.tabs{display:flex;border-bottom:1px solid var(--line);margin-top:14px}.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);padding:12px;font-weight:700;font-size:15px;cursor:pointer}.tabs button.on{color:var(--y);border-color:var(--y)}.sp{width:100%;border-collapse:collapse;margin:8px 0 20px;font-size:15px}.sp td{padding:11px 14px;border-bottom:1px solid var(--line)}.sp td:first-child{color:var(--mut);width:48%}.sp tr:nth-child(odd){background:var(--card)}h3{font-size:17px;margin:18px 0 4px}.note{background:var(--card);border-left:3px solid var(--y);padding:12px 14px;border-radius:8px;margin:14px 0}#msg{display:none;background:var(--card);border:1px solid var(--y);border-radius:12px;padding:14px;margin-top:12px;font-size:14px}
#ck{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.ckh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:3}.ckh button{background:none;border:0;color:var(--mut);font-size:15px;cursor:pointer}
.ckg{max-width:980px;margin:0 auto;padding:20px 18px 40px;display:grid;gap:20px}@media(min-width:820px){.ckg{grid-template-columns:1.3fr 1fr;align-items:start}.sum{position:sticky;top:76px}}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}.sec h3{margin:0 0 14px;font-size:16px}.sec h3 i{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--y);color:#000;font-style:normal;font-size:13px;margin-right:8px}
.fg{display:grid;gap:12px;grid-template-columns:1fr 1fr}.f{grid-column:1/-1}.f.h{grid-column:auto}.f label{display:block;font-size:13px;color:var(--mut);margin-bottom:5px}
.f input{width:100%;background:#0e0e0e;border:1px solid var(--line);border-radius:10px;padding:13px;color:var(--tx);font-size:16px}.f input:focus{outline:2px solid var(--y);border-color:var(--y)}.f.bad input{border-color:#ff5a5a}.f small{display:none;color:#ff7b7b;font-size:12px;margin-top:4px}.f.bad small{display:block}
.pixbox{border:2px solid var(--y);border-radius:12px;padding:14px;display:flex;gap:12px;background:rgba(255,196,0,.06)}
.it{display:flex;gap:12px;align-items:center;margin-bottom:12px}.it img{width:72px;height:72px;object-fit:contain;background:#fff;border-radius:10px}
.sum .row{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}.sum .tt{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-size:19px;font-weight:800}.sum .tt b{color:var(--y)}
.mini{display:inline-flex;align-items:center;gap:10px;margin-top:6px}.mini button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:18px;cursor:pointer}
.spn{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--y);border-radius:50%;animation:rt .8s linear infinite;margin-right:6px;vertical-align:-1px}@keyframes rt{to{transform:rotate(360deg)}}.trust{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:12px;margin-top:12px}
